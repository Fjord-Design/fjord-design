[package]
name = "fjord"
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4.6", features = ["derive"] }
hex = "0.4"
indexmap = "2.14"
percent-encoding = "2.3"
rayon = "1.12"
roxmltree = "0.21"
serde = "1"
serde_json = { version = "1.0.154", features = ["preserve_order", "float_roundtrip"] }
sha2 = "0.11"
tempfile = "3.27"

[dev-dependencies]
assert_cmd = "2.2"
predicates = "3.1"
rstest = "0.28"

[profile.release]
lto = "thin"
codegen-units = 1

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
unwrap_used = "deny"
expect_used = "deny"
