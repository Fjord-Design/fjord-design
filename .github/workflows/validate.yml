name: Validate Fjord

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5
        with:
          version: "2026.10.19"
      - name: Install the frozen dependency set
        run: mise run setup
      - name: Check sources, types, builds and deterministic output
        run: mise run ci
