[tools]
rust = { version = "1.99.1", components = "clippy,rustfmt" }

[tasks.test]
description = "Test token inheritance, exports and design validation"
run = "cargo test --locked"

[tasks.lint]
description = "Check formatting and lints"
run = ["cargo fmt --check", "cargo clippy --locked --all-targets -- -D warnings"]

[tasks.validate]
description = "Validate design tokens, contrast, fonts and icons"
run = "cargo run --locked --release --quiet -- validate"

[tasks.check]
description = "Check the shared design foundation"
depends = ["lint", "test", "validate"]

[tasks.build]
description = "Export DTCG, resolved JSON and token CSS for every mode"
run = "set -e; cargo build --locked --release --quiet; for mode in night day aurora; do for format in dtcg resolved css; do target/release/fjord export --mode \"$mode\" --format \"$format\"; done; done"

[tasks.ci]
description = "Check and build the design foundation"
run = ["mise run check", "mise run build"]
